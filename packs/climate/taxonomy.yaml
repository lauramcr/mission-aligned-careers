    b2b_saas: ["saas", "software", "platform", "api", "dashboard", "b2b", "logiciel"]
    hardware: ["hardware", "device", "sensor", "machine", "robot", "equipment", "battery"]
    marketplace: ["marketplace"]
    b2c: ["consumers", "households", "particuliers"]
    deep_tech: ["deep tech", "deeptech", "patented", "laboratory", "breakthrough technology"]
    services: ["consulting", "advisory", "conseil", "consultancy"]
    investment: ["venture capital", "invests in", "investment fund"]
  data_centrality:
    core: ["saas", "analytics", "data platform", "data science", "machine learning", "monitoring", "satellite", "dashboard", "digital twin"]
    supporting: ["hardware", "plant", "factory", "manufacturing", "device", "sensor", "materials", "chemistry", "pilot", "production"]
  org_types:
    investor: ["venture capital", "investment fund", "invests in", "portfolio companies"]
    accelerator_incubator: ["accelerator", "incubator", "incubateur"]
    nonprofit: ["non profit", "nonprofit", "association", "ngo", "charity", "think tank"]
    public_agency: ["public agency", "government agency", "agence publique"]

