  analytics_engineering:
    label: Analytics engineering
    title_keywords: ["analytics engineer"]
  data_science:
    label: Data science
    title_keywords: ["data scientist", "machine learning", "ml engineer", "scientifique des données"]
  data_analysis_bi:
    label: Data analysis / BI
    title_keywords: ["data analyst", "business intelligence", "bi analyst", "bi developer", "analyste données", "analyste data", "chargé d'études", "business analytics", "data analytics", "business analyst", "analytics lead", "analytics manager", "sustainability analyst", "climate analyst", "carbon analyst"]
