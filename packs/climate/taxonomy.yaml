    keywords: ["oil and gas", "oilfield", "petroleum", "upstream oil", "oil majors"]
  fossil_hydrogen:
    description: "grey or blue hydrogen"
    keywords: ["grey hydrogen", "gray hydrogen", "blue hydrogen", "steam methane reforming"]
  defence:
    description: "weapons and military equipment"
    keywords: ["defence", "defense", "military", "weapons", "armed forces"]
  fast_fashion:
    description: "high-volume, low-cost fashion retail"
    keywords: ["fast fashion"]
  agrochemicals:
    description: "synthetic pesticides and fertilisers"
    keywords: ["pesticides", "agrochemicals", "synthetic fertilizers"]
  aviation:
    description: "airlines, aircraft, airports"
    keywords: ["airline", "airlines", "aircraft", "aviation", "airport"]
  crypto:
    description: "cryptocurrencies, blockchain tokens"
    keywords: ["crypto", "cryptocurrency", "blockchain", "bitcoin", "stablecoin", "web3"]
  intensive_livestock:
    description: "industrial livestock farming"
    keywords: ["factory farming", "intensive livestock"]

org_types:
  - startup
  - scaleup
  - sme
  - large_company
  - public_operator         # e.g. transport operators
  - public_agency           # e.g. environment or investment agencies
  - investor                # VC, impact fund, public investment bank
  - accelerator_incubator
  - nonprofit
  - social_enterprise       # ESS, entreprise à mission, B Corp

business_models: [b2b_saas, b2c, marketplace, hardware, deep_tech, services, public_service, investment]

