[project]
name = "mission-aligned-careers"
version = "0.1.0"
description = "Config-driven pipeline that discovers companies and roles, scores their fit against a personal profile and watches career boards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tldextract>=5",
    "typer>=0.12",
]

[project.scripts]
radar = "job_radar.cli:app"

[dependency-groups]
api = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.8",
    "respx>=0.21",
]
orchestration = [
    "dagster>=1.13.26",
    "dagster-webserver>=1.13.26",
]

[tool.uv]
default-groups = ["dev", "orchestration", "api"]

[tool.dagster]
module_name = "job_radar.orchestration.definitions"
code_location_name = "mission_aligned_careers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH"]
# Real job titles use these (en dash, curly apostrophe, French inclusive middle dot).
allowed-confusables = ["–", "’", "·"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
