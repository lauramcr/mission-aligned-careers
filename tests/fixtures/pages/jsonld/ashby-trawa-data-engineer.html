<script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Data Engineer","description":"<h1>Senior Data Engineer</h1><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>About trawa</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">European energy costs are twice as high as in the United States and China. Electricity demand is expected to double by 2050. Market price volatility and complexity are here to stay - and the backbone of Europe's industrial economy is at risk.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">At trawa, we're building the solution: an integrated B2B energy platform combining procurement, energy management, and flexibility steering in a single product. That integration unlocks up to 30% in recurring electricity cost savings while helping companies make the switch to renewables.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">We're a Berlin-based scale-up of around 100 people. We've raised over €35M to date - including a €24M Series A in May 2025 - backed by Balderton, Headline, Speedinvest, AENU, Magnetic, and Tiny VC. All three founders are fully committed to building the utility of the future.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>The Team</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><strong>Data Intelligence (DINTEL)</strong> is an engineering team that owns trawa's data pipelines, and analytics infrastructure. We manage the full data lifecycle - from ingesting raw metering and market data, to invoicing and self-service analytics.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>About the Role</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">We're looking for a <strong>Senior Data Engineer</strong> to own and lead the development, reliability, and continuous evolution of our data platform. This is a high-ownership, high-autonomy role. You'll work across production systems at scale - defining technical direction, coordinating cross-team dependencies, and driving measurable impact across data engineering, analytics infrastructure, and operational tooling.</p><p style=\"min-height:1.5em\">You'll mentor teammates and be supported by experienced engineering leaders as you continue to grow your own leadership and technical skills.<br /><br />At trawa, our culture is generally \"office-first with flexibility\", where most of us are in our beautiful Berlin office the majority of the week, with room to occasionally work from home when needed. The Tech team follows a more hybrid rhythm, spending around 2-3 days a week in the office. We don’t set fixed office days or track attendance strictly, but teams coordinate what works best for them, because regular in-person collaboration remains an important part of how we work.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>What You'll Do</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead the design, implementation, and operation of critical data pipelines and platform infrastructure on AWS</p></li><li><p style=\"min-height:1.5em\">Define and evolve data quality standards, observability practices, and operational controls across the platform</p></li><li><p style=\"min-height:1.5em\">Lead cross-team technical discussions and help align stakeholders on data platform architecture decisions</p></li><li><p style=\"min-height:1.5em\">Deliver large-scale technical initiatives end-to-end, from design through delivery, collaborating with teams across the business</p></li><li><p style=\"min-height:1.5em\">Shape the team's technical culture through code reviews, mentorship, knowledge sharing, and documentation</p></li><li><p style=\"min-height:1.5em\">Evolve our analytics and BI tooling (ClickHouse, Metabase) to support business intelligence and decision-making</p></li><li><p style=\"min-height:1.5em\">Build and maintain data pipelines using Python (pandas, polars), dbt, and dlt</p></li><li><p style=\"min-height:1.5em\">Identify and address technical debt, improving platform reliability, scalability, and developer experience</p></li><li><p style=\"min-height:1.5em\">Communicate the value and impact of platform improvements to engineering and business stakeholders</p></li><li><p style=\"min-height:1.5em\">Diagnose and resolve complex data and performance challenges across multiple systems and services</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Your First 90 Days</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h3>First 6 Weeks - Getting Oriented</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build context across the data platform, including AWS, dbt, dlt, PostgreSQL, ClickHouse, and Python services</p></li><li><p style=\"min-height:1.5em\">Begin contributing to production systems and taking ownership of key platform components</p></li><li><p style=\"min-height:1.5em\">Build relationships with engineers and stakeholders across the business to understand data needs, priorities, and opportunities for improvement</p></li></ul><h3>By Month 3 - Building Momentum</h3><ul s :0\"> </div><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Why Join Us</strong></h2><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">🌍 <strong>Real impact</strong> - Join one of Europe's fastest-growing B2B energy platforms at a pivotal moment. Your work will directly support systems that help industrial companies cut costs and go green.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">🚀 <strong>Early ownership</strong> - We give team members responsibility from day one. You won't be shadowing - you'll be shipping.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">🤝 <strong>Mentorship that matters</strong> - Regular leadership sessions, cross-functional exposure, and engineers who are genuinely invested in your growth.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">📚 <strong>Learning culture</strong> - Annual learning budget, dedicated development time, and a team that takes knowledge-sharing seriously.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">🌐 <strong>Inclusive by design</strong> - 15+ nationalities, family-friendly policies, and a genuine commitment to building a place where everyone can do their best work.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">🎁 <strong>Solid benefits</strong> - A competitive package covering wellbeing, learning, and team experiences.</p>","directApply":false,"identifier":{"@type":"PropertyValue","name":"trawa","value":"62a94b9d-7b35-44f6-ab42-60a610e0588f"},"datePosted":"2026-06-15","hiringOrganization":{"@type":"Organization","name":"trawa","sameAs":"https://www.trawa.de","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/c9d5b0b8-3b31-4fb6-8ea5-088330538813/c2d48d40-8e14-45a1-889f
