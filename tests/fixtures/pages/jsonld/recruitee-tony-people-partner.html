to Bar People Partnering team, coaching People Partners in the Factory and West Africa, while contributing to the broader People &amp; Culture agenda through projects, process improvements and data-driven insights.<br /><br /></span></p><p><span>In your first months, you will focus on building strong relationships across your business areas, understanding operational priorities and identifying opportunities to enhance employee experience, leadership effectiveness and organizational performance. Over time, you will become a trusted sparring partner who proactively shapes people strategies and that drive sustainable business impact, connecting business needs with employee development and capabilities.<br /><br /></span></p><p><strong><span>All wrapped up</span></strong><span> </span></p><ul><li><p><span>Partner with leaders across our supply chain: Operations, the Factory, Super Store and Tony’s Open Chain to translate business priorities into effective people strategies, organizational design initiatives and workforce plans that enable business success.</span></p></li></ul><ul><li><p><span>End-to-end Supply chain focus will help you to connect the business and people need and opportunities, bringing efficiency and alignment on people needs and impact throughout the supply chain.</span></p></li><li><p><span>Coach and advise people leaders on the full employee lifecycle, including recruitment, onboarding, performance management, talent development, succession planning, employee engagement and offboarding.</span></p></li></ul><ul><li><p><span>Drive talent and leadership development by identifying capability gaps, facilitating development initiatives and partnering with the Talent team to create growth opportunities that strengthen organizational effectiveness.</span></p></li></ul><ul><li><p><span>Lead complex employee relations matters, including performance improvement processes, absenteeism cases, workplace wellbeing initiatives, severance processes and the consistent application of People &amp; Culture policies.</span></p></li></ul><ul><li><p><span>Act as the subject matter expert on wellbeing, partnering with occupational health providers and leaders to improve employee wellbeing, reduce absenteeism and ensure compliance with relevant legislation and regulations.</span></p></li></ul><ul><li><p><span>Lead and develop the Bean to Bar People Partnering team by coaching and supporting People Partners, ensuring consistency in ways of working, capability development and knowledge sharing across the team.</span></p></li></ul><ul><li><p><span>Represent the needs of Operations, the Factory, Super Store and TOC within the wider People &amp; Culture function, collaborating on projects, policies and process improvements that enhance employee experience and business performance.</span></p></li></ul><ul><li><p><span>Use people insights, analytics and reporting to identify trends, support decision-making and improve attraction, retention, engagement and workforce planning outcomes.</span></p></li></ul><ul><li><p><span>Support the implementation and adoption of People &amp; Culture programs, ensuring processes, policies and systems are embedded effectively and consistently throughout the business.</span></p></li></ul><p></p><p></p><br /><p><strong><span>Our new flavor</span></strong><span> <br /></span></p><ul><li><p><span>You have 6+ years of experience in HR advisory, HR business partnering or People Partnering roles, </span><strong><span>within FMCG, manufacturing, supply chain or operational environments.</span></strong></p></li></ul><ul><li><p><span>You have experience partnering with senior leaders and coaching managers on a wide range of people topics, including performance, organizational development and employee relations.</span></p></li></ul><ul><li><p><span>You have strong knowledge of Dutch employment law and experience working within international or EMEA-based organizations.</span></p></li></ul><ul><li><p><span>You have proven experience managing complex employee relations cases, wellbeing initiatives, absence management and organizational change.</span></p></li></ul><ul><li><p><span>You are an effective stakeholder manager who can build trusted relationships, influence decisions and challenge stakeholders constructively across all levels of the organization.</span></p></li></ul><ul><li><p><span>You have experience leading projects and driving cross-functional People &amp; Culture initiatives from concept through implementation.</span></p></li></ul><ul><li><p><span>You are comfortable working with HR systems, people analytics, Excel and reporting tools to generate insights and support decision-making.</span></p></li></ul><ul><li><p><span>You are fluent in English and Dutch, both written and verbal. French language skills are considered a strong advantage.</span></p></li></ul><ul><li><p><span>You are highly organized, able to manage complexity, prioritize effectively and maintain attention to detail in a fast-paced environment.</span></p></li></ul><ul><li><p><span>You handle confidential and sensitive information with professionalism, integrity and discretion.<br /><br /></span></p><p><strong><span>Our benefits (the icing on the cake)</span></strong><span> <br /></span></p><p><span>At Tony's you will get the opportunity to be part of something extraordinary; first and foremost by making real impact in the world, while enjoying the great benefits we offer as you help us succeed. We are dedicated to enabling all Tonys to grow and develop their careers through training programs, regular feedback cycles, coaching and a generous learning and development budget.<br /><br /></span></p><p><span>We also offer a wide range of additional benefits, including a delicious vegetarian lunch, company bonus, a minimum of 28 holidays, inspirational team updates, unforgettable events and unlimited chocolate. But we also know chocolate will not pay the bills, so we ensure our compensation is just as rewarding.
