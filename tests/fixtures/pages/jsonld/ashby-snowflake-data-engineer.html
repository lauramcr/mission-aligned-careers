<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Data Engineer @ Snowflake</title><script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Data Engineer","description":"<p style=\"min-height:1.5em\">At Snowflake, we are powering the era of the agentic enterprise. To usher in this new era, we seek AI-native thinkers across every function who are energized by the opportunity to reinvent how they work. You don’t just use tools; you possess an innate curiosity, treating AI as a high-trust collaborator that is core to how you solve problems and accelerate your impact. We look for low-ego individuals who thrive in dynamic and fast-moving environments and move with an experimental mindset — who rapidly test emerging capabilities to discover simpler, more powerful ways to deliver results. At Snowflake, your role isn't just to execute a function, but to help redefine the future of how work gets done.</p><p style=\"min-height:1.5em\">At Snowflake, we are powering the era of the agentic enterprise. To usher in this new era, we seek AI-native thinkers across every function who are energized by the opportunity to reinvent how they work. You don't just use tools; you possess an innate curiosity, treating AI as a high-trust collaborator that is core to how you solve problems and accelerate your impact. We look for low-ego individuals who thrive in dynamic and fast-moving environments and move with an experimental mindset, rapidly testing emerging capabilities to discover simpler, more powerful ways to deliver results. At Snowflake, your role isn't just to execute a function, but to help redefine the future of how work gets done.</p><p style=\"min-height:1.5em\">Snowflake is about empowering enterprises to achieve their full potential, and people too. With a culture that's all in on impact, innovation, and collaboration, Snowflake is the sweet spot for building big, moving fast, and taking technology and careers to the next level.</p><p style=\"min-height:1.5em\">We are looking for a Data Engineer to help build and operate the data pipelines and models that power internal decision-making on the Snowflake AI Data Cloud. You will work alongside senior engineers, learn our platform from the inside as customer zero, and grow your ownership of production data products over time.</p><p style=\"min-height:1.5em\"><strong>AS A DATA ENGINEER AT SNOWFLAKE, YOU WILL:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build and maintain production data pipelines and models on Snowflake, from ingestion through transformation and consumption</p></li><li><p style=\"min-height:1.5em\">Develop dbt models with tests and documentation that follow team standards and governance practices</p></li><li><p style=\"min-height:1.5em\">Build and support Apache Airflow DAGs that orchestrate Snowflake workloads reliably</p></li><li><p style=\"min-height:1.5em\">Ingest data from enterprise sources using Snowpipe, Snowpark, and dynamic tables</p></li><li><p style=\"min-height:1.5em\">Apply data quality checks and help monitor Snowflake warehouse cost and performance</p></li><li><p style=\"min-height:1.5em\">Act as an internal customer zero, sharing feedback on Snowflake features with Product teams</p></li><li><p style=\"min-height:1.5em\">Take part in Agile ceremonies including stand ups, sprint planning, reviews, and retrospectives</p></li><li><p style=\"min-height:1.5em\">Partner with stakeholders and senior engineers to turn well-defined requirements into scoped technical tasks</p></li></ul><p style=\"min-height:1.5em\"><strong>OUR IDEAL DATA ENGINEER WILL HAVE:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Bachelor's degree in Computer Science, Information Systems, or a related field, or equivalent practical experience</p></li><li><p style=\"min-height:1.5em\">3+ years of hands-on experience building data pipelines or data models in a production environment</p></li><li><p style=\"min-height:1.5em\">Strong SQL and working Python skills, including basic query tuning and schema design</p></li><li><p style=\"min-height:1.5em\">Hands-on experience with a cloud data warehouse, ideally Snowflake</p></li><li><p style=\"min-height:1.5em\">Working knowledge of dbt and an orchestration tool such as Apache Airflow</p></li><li><p style=\"min-height:1.5em\">Understanding of dimensional modelling concepts</p></li><li><p style=\"min-height:1.5em\">Clear written and verbal communication and a collaborative, curious approach to learning</p></li><li><p style=\"min-height:1.5em\">Ownership mindset: you follow problems through to resolution and ask for help when needed</p></li></ul><p style=\"min-height:1.5em\"><strong>BONUS POINTS FOR THE FOLLOWING:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Exposure to Snowflake Cortex AI functions or other LLM APIs for data enrichment</p></li><li><p style=\"min-height:1.5em\">Experience preparing data for ML model training or feature engineering</p></li><li><p style=\"min-height:1.5em\">Familiarity with streaming ingestion such as Kafka or Snowpipe Streaming</p></li><li><p style=\"min-height:1.5em\">Experience with AWS, Azure, or GCP, including infrastructure-as-code</p></li><li><p style=\"min-height:1.5em\">Awareness of data contracts or schema registry tooling</p></li></ul><p style=\"min-height:1.5em\">Snowflake is growing fast, and we’re scaling our team to help enable and accelerate our growth. We are looking for people who share our values, challenge ordinary thinking, and push the pace of innovation while building a future for themselves and Snowflake.</p><p style=\"min-height:1.5em\">How do you want to make your impact?</p><p style=\"min-height:1.5em\">For jobs located in the United States, please visit the job posting on the Snowflake Careers Site for salary and benefits information: <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://careers.snowflake.com\">careers.snowflake.com</a></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Snowflake","value":"1af751fb-d53e-43b0-a3bc-6fcc4004cafb"},"datePosted":"2026-10-28","hiringOrganization":{"@type":"Organization","name":"Snowflake","sameAs":"https://www.snowflake.com/","logo":"https://example.com/image.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Pune","addressCountry":"India"}},"employmentType":"FULL_TIME"}</script></head><body><h1>Data Engineer @ Snowflake</h1></body></html>
